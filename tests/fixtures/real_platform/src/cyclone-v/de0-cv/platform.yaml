# The memory map of the SDRAM platform with the FLASH behind the caches: the BOOT_MEMORY inside the core, the
# FLASH (right after the BOOT_MEMORY, up to 256 KiB) and the board's 64 MB SDRAM (the RAM) reached through the instruction and data
# caches: the source of truth `riscv-tools check-memory-map` checks every hand-written copy against.
#
#   uv run riscv-tools --root . check-memory-map --platform src/cyclone-v/de0-cv/platform.yaml
#
# Paths in `checks` are relative to the root of this repository; `Core` and
# `Memory` are the submodules of this repository.
# The copies that the project running the tests owns (its config.yaml, the
# generated rv32_test.h) are not here: its memory section is this platform's
# config.yaml, extended, and the header is generated from it.
platform: de0-cv
# The board of the platform: `auto` asks for the identification by the JTAG; `boards` lists the boards it is built on.
board: auto
boards: [de0-cv]
# The component of paths.yaml whose closure of `requires` is the source list of the generated project.
top: Insper-RISC-V/de0_cv_board
# The profile of the platform: its base ISA (rv32i: 32 registers, rv32e: 16) and the extensions of the core.
# `--profile NAME` of riscv-tools replaces it for one run (a matrix of tests); `profiles` is the specification.
profile: rv32im_zicclsm_zicntr_zihpm_zifencei
profiles: ../../../Core/profiles/matrix.yaml

regions:
  - {name: BOOT_MEMORY, base: 0x00000000, size: 4K,   kind: rom, exec: true}
  - {name: FLASH,    base: 0x00001000, size: 252K, kind: rom, exec: true}
  - {name: RAM,      base: 0x40000000, size: 64M,  kind: ram}   # the SDRAM

# Words at the top of RAM: the contract between the boot memory, the program and
# the host (platform/boot_memory.S clears them at every reset).
reserved:
  stdout:   {base: 0x43FFFBE0, size: 1K+8}
  tohost:   {base: 0x43FFFFE8, size: 8}
  fromhost: {base: 0x43FFFFF0, size: 8}

boot:
  entry: 0x00001000
  wait_restart: 0x00000100

# The two banks of the FLASH for the program update: each starts with the 256-byte header page of the image
# (riscv-tools flash-image), so its program is linked from the bank base + 0x100. Bank A [0x1000, 0x20000) and
# bank B [0x20000, 0x40000) are aligned to the 4 KiB sector.
flash:
  region: FLASH
  banks:
    - {name: A, base: 0x00001000, size: 124K}
    - {name: B, base: 0x00020000, size: 128K}

# The slots of the external interconnect (bits 30:28 of the address): the FLASH controller of the program update
# (commands of the FLASH chip; wired in the board top and, with HAS_FLASH_CONTROLLER, in the simulation top), the
# JTAG UART and the seven-segment display of the board top, the CLINT (a 64 KiB slot: msip, mtimecmp and mtime) and the
# PLIC (a 4 MiB window), the controller of the external interrupt lines, whose output is the MEIP of the core.
peripherals:
  - {name: FLASH_CTRL, base: 0xB0000000, id: 3}
  - {name: UART,    base: 0xC0000000, id: 4}
  - {name: DISPLAY, base: 0xD0000000, id: 5}
  - {name: CLINT,   base: 0xE0000000, id: 6}
  - {name: PLIC,    base: 0xF0000000, id: 7, size: 4M}

# The machine interrupts: MTIP and MSIP come from the CLINT, MEIP from the PLIC, all in the clock domain of the core
# (76.923077 MHz here), so no synchronizer is needed. The mtime of the CLINT counts at mtime_hz (77 cycles per tick) and is
# mirrored by the CSR time of Zicntr, which the core serves (o_mtime of the CLINT into i_mtime of the core).
interrupts:
  # `clock_hz` is left out: it is `clocks.core` (76.923077 MHz) rounded to a whole number of cycles per tick, 77 MHz, so the
  # mtime counts 0.1 % slower than mtime_hz.
  mtime_hz: 1000000
  # The PLIC: three-bit priorities, and the lines wired in this platform: the JTAG UART (board and simulation) and the
  # FLASH controller (board and simulation).
  plic: {priority_bits: 3}
  sources:
    - {name: UART_JTAG, id: 2}
    - {name: FLASH,     id: 6}

# The memory model: the FLASH is emulated in the M10K blocks with the latency of a serial chip (24 cycles for the first
# word of a burst, 4 for each following) and the SDRAM is the device of the board, both outside the core behind the
# instruction and the data caches (32768 bits, 4 KiB, the size of the cache entities). The package takes ROM_EXTERNAL,
# RAM_EXTERNAL and the caches from here.
memory:
  rom:    {external: true, backend: emulado, latency: {first: 24, next: 4}, sector_bytes: 4096}
  ram:    {external: true, backend: dispositivo, device: sdram}
  icache: {enabled: true, size_bits: 32768}
  dcache: {enabled: true, size_bits: 32768}

# The clocks of the PLL, the single source of the generated PLL (`riscv-tools board generate`) and of the periods the
# generated files convert with. `mem` is the clock of the SDRAM controller (the DRAM_CLK pin has the same frequency, its
# phase comes from the board), at 100 MHz against the core, a 1.3 to 1 ratio, so its pin paths have 10 ns instead of 7 ns.
# `core` and `fetch` run at 76.923077 MHz (1000 MHz / 13): the highest frequency whose five seeds close the setup at 85 C and
# the hold at 0 C in every domain (docs/pt-br/platform/timing/FRENTE-F-ONDA2.md); `interrupts.clock_hz` rounds it to a
# whole number of cycles per tick. The phase of the core (7500 ps) against the fetch clock was measured by the Quartus timing
# of the 5 seeds: it splits the 20 ns of the loop through the instruction cache between its two crossings
# (docs/pt-br/platform/timing/MARCOS.md).
clocks:
  core:  {mhz: 76.923077, phase_ps: 7500}
  fetch: {mhz: 76.923077, phase_ps: 0}
  mem:   {mhz: 100}

# The console is the JTAG UART (Virtual JTAG); the roles of inputs and outputs the platform wires.
console: jtag
io:
  leds:     {count: 10, need: required}
  switches: {count: 10, need: optional}
  keys:     {count: 4,  need: optional}
  display:  {count: 6,  need: optional}

# Extensions outside the matrix of the Core that the platform turns on (HAS_ZIMOP, HAS_ZICOND, HAS_ZIHINTNTL, HAS_ZIHINTPAUSE and HAS_INTERRUPTS of the package).
extras: [Zimop, Zicond, Zihintntl, Zihintpause, Interrupts, Sscofpmf, AccessFaults]

# The files written from this map by `riscv-tools generate-memory-map` (`make generate`): the linker
# flags of the test programs and the linker script of the boot memory. `make memory-map` checks they are up to date.
generate:
  specs: {path: src/cyclone-v/de0-cv/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  bank_specs:
    - {path: src/cyclone-v/de0-cv/runtime/rv32im-fpga-bank-a.specs, rom: BANK_A_PAYLOAD, ram: RAM, ram_limit: stdout}
    - {path: src/cyclone-v/de0-cv/runtime/rv32im-fpga-bank-b.specs, rom: BANK_B_PAYLOAD, ram: RAM, ram_limit: stdout}
  banks_h: {path: src/cyclone-v/de0-cv/runtime/flash_banks.h}
  boot_ld: {path: src/cyclone-v/de0-cv/runtime/boot_memory.ld}
  runtime: {path: src/cyclone-v/de0-cv/runtime/memory_map.h, ram: RAM}
  vhdl:
    path: src/cyclone-v/de0-cv/de0_cv_map_pkg.vhd
    package: de0_cv_map_pkg
    rom: FLASH
    ram: RAM

# What the config.yaml of the platform reads from this map (`memory_map: platform.yaml`). The RAM is the SDRAM, so
# only the BOOT_MEMORY and the FLASH are simulation arrays with an address width.
config:
  rom: FLASH
  ram: RAM
  addr_widths: [boot_memory, rom]

checks:
  # --- config.yaml ---------------------------------------------------------
  - {name: config.yaml UART_SLOT, file: src/cyclone-v/de0-cv/config.yaml, pattern: 'UART_SLOT: "(\d+)"', expect: UART.id}

  # --- boot memory (boot_memory.S; its linker script is generated) --------------

  # --- runtime and Spike stand-in (shared with the sdram platform) ----------

  # --- VHDL of the core ----------------------------------------------------

  # --- the SDRAM is the RAM: the core decodes it as its external data region -------------

  # --- the testbench and the test programs' header (only in RV32IM's tree) -----------------
  - {name: Tests header RV32_RAM_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_BASE\s+(0x[0-9A-Fa-f]+)', expect: RAM.base}
  - {name: Tests header RV32_RAM_END, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_END\s+(0x[0-9A-Fa-f]+)', expect: RAM.end}
  - {name: Tests header RV32_STDOUT_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_STDOUT_BASE\s+(0x[0-9A-Fa-f]+)', expect: stdout.base}
  - {name: Tests header RV32_UART_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_UART_BASE\s+(0x[0-9A-Fa-f]+)', expect: UART.base}
  - {name: Tests header RV32_FLASH_CTRL_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_FLASH_CTRL_BASE\s+(0x[0-9A-Fa-f]+)', expect: FLASH_CTRL.base}
  - {name: Tests header RV32_BANK_A_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_BANK_A_BASE\s+(0x[0-9A-Fa-f]+)', expect: BANK_A.base}
  - {name: Tests header RV32_BANK_A_SIZE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_BANK_A_SIZE\s+(0x[0-9A-Fa-f]+)', expect: BANK_A.size}
  - {name: Tests header RV32_BANK_B_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_BANK_B_BASE\s+(0x[0-9A-Fa-f]+)', expect: BANK_B.base}
  - {name: Tests header RV32_BANK_B_SIZE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_BANK_B_SIZE\s+(0x[0-9A-Fa-f]+)', expect: BANK_B.size}
  - {name: Tests header RV32_TICK_CYCLES, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_TICK_CYCLES\s+(\d+)', expect: INTERRUPTS.tick_cycles}
