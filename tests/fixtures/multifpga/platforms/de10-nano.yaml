platform: de10-nano
board: auto
boards: [de10-nano]
core:
  type: 32
  base: I
  extensions: []
regions:
  - {name: BOOT_MEMORY, base: 0x00000000, size: 4K,  kind: rom, exec: true}
  - {name: FLASH,       base: 0x00001000, size: 12K, kind: rom, exec: true}
  - {name: RAM,         base: 0x40000000, size: 16K, kind: ram}
memory:
  rom:    {external: true, backend: emulado}
  ram:    {external: true, backend: emulado}
  icache: {enabled: false, size_bits: 0}
  dcache: {enabled: false, size_bits: 0}
clocks:
  core: {mhz: 50, phase_ps: 0}
console: jtag
generate:
  vhdl: {path: de10_nano_map_pkg.vhd, package: de10_nano_map_pkg, rom: FLASH, ram: RAM}
