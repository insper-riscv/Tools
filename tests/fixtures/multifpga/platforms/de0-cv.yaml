platform: de0-cv
board: auto
boards: [de0-cv]
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicclsm
    - Zicntr
    - Zihpm
    - Zifencei
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: emulated
      base: 0x00001000
      size: 252K
      on_bus: true
      latency:
        first: 24
        next: 4
      sector_bytes: 4096
      cache:
        size_bits: 32768
  data:
    - type: sdram
      base: 0x40000000
      size: 64M
      on_bus: true
      cache:
        size_bits: 32768
clocks:
  core:  {mhz: 76.923077, phase_ps: 7500}
  fetch: {mhz: 76.923077, phase_ps: 0}
  mem:   {mhz: 100}
console: jtag
io:
  leds:
    count: 10
    need: required
  switches:
    count: 10
    need: optional
  keys:
    count: 4
    need: optional
  display:
    count: 6
    need: optional
generate:
  vhdl: {path: de0_cv_map_pkg.vhd, package: de0_cv_map_pkg, rom: FLASH, ram: RAM}
peripherals:
  FLASH_CTRL:
    base: 0xB0000000
    size: 16
  UART:
    base: 0xC0000000
    size: 16
  DISPLAY:
    base: 0xD0000000
    size: 16
  CLINT:
    base: 0xE0000000
    size: 64K
  PLIC:
    base: 0xF0000000
    size: 4M
interrupts:
  clock_hz: 50000000
  mtime_hz: 1000000
  plic: {priority_bits: 3}
  sources:
    - {name: UART_JTAG, size: 16}
    - {name: FLASH,     id: 6}
