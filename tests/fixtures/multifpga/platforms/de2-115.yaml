platform: de2-115
board: auto
boards: [de2-115]
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicntr
    - Zifencei
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: flash
      base: 0x00001000
      size: 1024K
      on_bus: true
      cache:
        size_bits: 32768
  data:
    - type: sdram
      base: 0x40000000
      size: 128M
      on_bus: true
      cache:
        size_bits: 32768
clocks:
  core: {mhz: 50, phase_ps: 8250}
  mem:  {mhz: 100}
console: jtag
io:
  leds:
    count: 18
    need: required
  display:
    count: 8
    need: optional
generate:
  vhdl: {path: de2_115_map_pkg.vhd, package: de2_115_map_pkg, rom: FLASH, ram: RAM}
