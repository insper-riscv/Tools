platform: mkr-vidor-4000
board: auto
boards: [mkr-vidor-4000]
core:
  type: 32
  base: I
  extensions: []
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: emulated
      base: 0x00001000
      size: 12K
      on_bus: true
  data:
    - type: emulated
      base: 0x40000000
      size: 16K
      on_bus: true
clocks:
  core: {mhz: 48, phase_ps: 0}
console: jtag
generate:
  vhdl: {path: mkr_vidor_4000_map_pkg.vhd, package: mkr_vidor_4000_map_pkg, rom: FLASH, ram: RAM}
