# pins.yaml da placa, no esquema do documento 02, seção 3.3. confirmed: manual (lido no manual) | repo (lido no .qsf do repositório) | inferred (deduzido de fonte de terceiro).
# Pinos da Terasic DE10-Nano (Cyclone V SoC 5CSEBA6U23I7). Fonte principal: DE10-Nano User Manual de 13/03/2017 (Terasic).
# Cópia lida: https://download.kamami.pl/p564537-p564536-DE10-Nano_User_manual.pdf (outras cópias: Mouser, FTP da Intel)
# O manual traz apenas "3.3V"; o padrão no Quartus é 3.3-V LVTTL (inferido).
# Direção "inout" para GPIO é a capacidade do pino. Pinos HPS (UART, HPS_KEY, HPS_LED, DDR3) não são pinos de fabric.
# A tabela 3-8 do manual omite LED[6] e LED[7]; os pinos vêm da figura 3-19 (confirmado no manual, figura).
board: de10-nano
device: 5CSEBA6U23I7
notes:
  - "nomes: os barramentos usam colchetes (ARDUINO_IO[0], HDMI_TX_D[0]); o manual escreve Arduino_IO0 e HDMI_TX_D0"
  - "hps: os pinos do HPS (DDR3, Ethernet, USB, microSD) sao dedicados e nao entram neste arquivo; so HPS_UART_*, HPS_KEY e HPS_LED estao listados e nao pertencem ao fabric"
  - "led: LED[6] e LED[7] vem da figura 3-19 do manual, nao da tabela 3-8; conferir no esquematico antes do primeiro uso"
