# pins.yaml da placa, no esquema do documento 02, seção 3.3. confirmed: manual (lido no manual) | repo (lido no .qsf do repositório) | inferred (deduzido de fonte de terceiro).
# Mapa de pinos da Terasic DE10-Lite (MAX 10 10M50DAF484C7G).
# Fonte unica: DE10-Lite User Manual, 5 jun 2020 (paginas aproximadas, tiradas do indice de secoes do PDF; a tabela citada e exata).
# URL: https://cw.fel.cvut.cz/wiki/_media/courses/b2m37mam/tutorials/dev_kits/de10-lite_user_manual.pdf
# Polaridades confirmadas no manual: LEDR ativo em alto, HEX ativo em baixo (anodo comum), KEY solta em alto (Schmitt, ver nota), SW cima=alto.
# Observacao sobre os padroes de E/S: o manual lista 3.3-V LVTTL; para a SDRAM o texto da secao 3.9 diz 3.3V LVCMOS.
board: de10-lite
device: 10M50DAF484C7G
notes:
  - "manual: DE10-Lite User Manual, June 5, 2020"
  - "nomes: os barramentos usam colchetes (LEDR[0], HEX0[0], GPIO[0], ARDUINO_IO[0]); o manual escreve LEDR0, HEX00, GPIO_0 e Arduino_IO0"
  - "uart: sem ponte USB-UART; ARDUINO_IO[0] (RXD) e ARDUINO_IO[1] (TXD) servem a um adaptador externo"
