# O manual traz apenas "3.3V"; o padrão no Quartus é 3.3-V LVTTL (inferido). KEY[0..1] e KEY ativos em nível baixo com Schmitt trigger.
# Fora desta lista: pinos HPS (DDR3, Ethernet, UART, USB, microSD, HPS_KEY/HPS_LED), que não são fabric. Direção "inout" para GPIO é a capacidade do pino.
board: de0-nano-soc
device: 5CSEMA4U23C6N
notes:
  - "nomes: os barramentos usam colchetes (ARDUINO_IO[0]); o manual escreve Arduino_IO0"
  - "hps: os pinos do HPS (DDR3, Ethernet, USB, microSD, UART, HPS_KEY, HPS_LED e os relogios HPS_CLK*) sao dedicados e nao entram neste arquivo"
  - "padrao de E/S: o manual diz apenas 3.3V; 3.3-V LVTTL e o padrao do Quartus para esse nivel (inferido)"
