# pins.yaml da placa, no esquema do documento 02, seção 3.3. confirmed: manual (lido no manual) | repo (lido no .qsf do repositório) | inferred (deduzido de fonte de terceiro).
# Pinos da DE0-CV (Cyclone V 5CEBA4F23C7). Gerado a partir de de0-cv.qsf (Insper-RISC-V, ramo onda2)
# e cruzado com amaranth-boards (de0_cv.py). O manual oficial da Terasic nao pode ser baixado
# (ver de0-cv.md, secao 1), por isso nenhum sinal esta marcado como "manual" ou "ambos".
board: de0-cv
device: 5CEBA4F23C7
notes:
  - "uart: a DE0-CV nao tem ponte USB-UART; o projeto usa JTAG UART (Virtual JTAG), sem pino"
  - "adc: a placa nao tem ADC"
  - "flash_usuario: nao ha FLASH de usuario; so o EPCS64 de configuracao. SPI_FLASH_* do .qsf e um chip externo reservado no GPIO_0 (comentado)"
  - "jtag: TCK/TMS/TDI/TDO sao pinos dedicados do dispositivo ligados ao USB-Blaster; nao sao atribuidos no .qsf"
  - "configuracao: MSEL, nCONFIG, DCLK, EPCS (AS) sao pinos dedicados; valores nao verificados"
  - "sdram: sinais de controle: nomes e pinos conferem com o Amaranth; falta so a conferencia contra a Tabela 3-13 do manual"
conflicts:
  - {pin: "M16", signals: ["SPI_FLASH_CS", "GPIO_0[2]"], note: "alias: SPI_FLASH_CS e o GPIO_0[2] do header, reservado a um chip externo"}
