# Plataforma de exemplo do kind `eth` em modo RGMII (cópia 1 do papel) na placa de exemplo (ver boards/example).
platform: example-eth-rgmii
board: example
boards: [example]
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicntr
    - Zifencei
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: flash
      base: 0x00001000
      size: 1024K
      on_bus: true
      cache:
        size_bits: 32768
  data:
    - type: sdram
      base: 0x40000000
      size: 128M
      on_bus: true
      cache:
        size_bits: 32768
clocks:
  core: {mhz: 50, phase_ps: 8250}
  mem:  {mhz: 100}
console: jtag
io:
  leds:
    count: 18
    need: required
interrupts:
  clock_hz: 50000000
  mtime_hz: 1000000
  plic: {priority_bits: 3}
peripherals:
  CLINT: {base: 0xE0000000, size: 64K}
  PLIC: {base: 0xF0000000, size: 4M}
  ETH0: {kind: eth, mode: rgmii, instance: 1, shifted_txc: true, base: 0x8000E000, phy_addr: 16, mdc_freq_hz: 1000000, poll_cycles: 1000, tx_buffer_addr_bits: 10, rx_buffer_addr_bits: 8, rx_fifo_addr_bits: 5, sync_stages: 3, reset_cycles: 32}
generate:
  vhdl: {path: example_eth_rgmii_map_pkg.vhd, package: example_eth_rgmii_map_pkg, rom: FLASH, ram: RAM}
