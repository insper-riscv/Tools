# Primitivas de fabricante que o projeto instancia por `component`.
# O Quartus Lite só expõe estas megafunções pelo pacote altera_mf_components, sem unidade primária de entidade:
# `entity altera_mf.altsyncram` é rejeitado pelo quartus_map 25.1 (Error 10481). A component_900 aceita a
# declaração e a instância destes nomes quando a biblioteca da primitiva está visível no arquivo (`library <biblioteca>;`
# ou `use <biblioteca>.<pacote>.all;`). Todo outro `component` continua acusado. IP gerado (PLL, por exemplo) NÃO entra
# aqui: o arquivo gerado vai para `tree.vhdl_style.exclude` do `paths.yaml` do repositório.
primitives:
  - name: altsyncram
    library: altera_mf
    reason: Megafunção de RAM do Quartus, exposta só pelo pacote altera_mf_components (sem entidade visível).
  - name: sld_virtual_jtag
    library: altera_mf
    reason: Megafunção de JTAG virtual do Quartus, exposta só pelo pacote altera_mf_components (sem entidade visível).
