[project]
name = "riscv-tools"
version = "1.0.0"
description = "CLI do Insper-RISC-V: Compila, simula (GHDL/cocotb), testa e certifica (ACT4) os módulos do core RISC-V RV32 a partir de manifestos YAML."
license = "Apache-2.0"
# Capped at <3.15: 3.14 is the newest Python version that cocotb run on.
# (https://docs.cocotb.org/en/v2.1.0/release_notes.html)
requires-python = ">=3.14,<3.15"
dependencies = [
    "cocotb>=2.1",
    "PyYAML>=6.0",
]

[project.scripts]
riscv-tools = "riscv_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riscv_tools"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.8",
    "pyright[nodejs]>=1.1",
    "deptry>=0.20",
    "pylint>=4.1.3",
]

[tool.deptry]
known_first_party = ["riscv_tools"]

[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = "stubs"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingModuleSource = "none"

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = [
    # Core
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes

    # Security
    "S",    # flake8-bandit (Security Scanning/SAST)
    "BLE",  # flake8-blind-except

    # Import orders and formatting
    "I",    # isort
    "Q",    # flake8-quotes
    "D",    # pydocstyle

    # Standards and Moderization
    "UP",   # update-checker
    "N",    # pep8-naming,
    "PTH",  # flake8-pathlib
    "TID",  # flake8-tidy-imports (absolute imports only)

    # Quality and Simplification
    "B",    # flake8-bugbear
    "G",    # flake8-logging-format
    "PERF", # perflint
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PL",   # pylint
    "RUF",  # ruff linting rules

    # Cleanup and Unused Code
    "ERA",  # flake8-eradicate
    "ARG",  # flake8-arg-names (unused-arguments)
]

# PEP 257 rules the numpy convention turns off.
extend-select = [
    "D107",  # docstring in __init__
    "D402",  # summary line must not repeat the signature
]

ignore = [
    "S603",
    "S607",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pycodestyle]
max-line-length = 79
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-returns = 6
max-branches = 12
max-locals = 15
max-public-methods = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"tests/fixtures/**" = ["B011", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = 72

[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures"]

[tool.complexipy]
paths = ["src", "tests"]
max-complexity-allowed = 10

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests"]
search-path = ["tests"]
python-version = "3.14"

[tool.pylint.main]
ignore = [".venv"]
fail-under = 10
source-roots = ["src"]
# The test modules import their helpers (support.py) as top-level modules.
init-hook = "import sys; sys.path.append('tests')"

[tool.pylint.messages_control]
disable = [
    "redefined-outer-name",   # pytest fixtures are injected by parameter name
    "too-few-public-methods", # stubs and small data holders in tests
]
