name: tree

on:
  # Push só na main: em outra branch o pull_request já roda o mesmo workflow.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tree-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Digests of the CI images, read from ci-images.lock (never `:latest`); the lock changes by pull request.
  image:
    name: image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        uses: insper-riscv/Infra/.github/actions/ci-plan@onda1

  # Confere a árvore do repositório com as regras do Capstone (riscv-tools check-tree): arquivos padrão,
  # espelho entre docs/pt-br e docs/en e, nos repositórios de VHDL, a posição dos arquivos.
  tree:
    name: tree
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # O riscv-tools de insper-riscv/Infra.
    container:
      image: ${{ fromJSON(needs.image.outputs.images)['ci-vhdl'] }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the tree
        run: riscv-tools --root . check-tree --kind tools

      - name: Check the VHDL style
        run: riscv-tools --root . check-vhdl-style
