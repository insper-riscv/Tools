name: static-analysis

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ruff lint
            run: uv run ruff check . --output-format=github
          - name: ruff format
            run: uv run ruff format . --check
          - name: pyright
            run: uv run pyright
          - name: pyrefly
            run: uvx pyrefly check
          - name: deptry
            run: uv run deptry .
          - name: complexipy
            run: uvx complexipy .
          - name: codeclone
            run: uvx codeclone . --fail-on-new
          - name: semgrep
            run: uvx semgrep scan --config p/python --error .
          - name: uv audit
            run: uv audit

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v7.1.0

      - name: Install the project
        run: uv sync --locked

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
