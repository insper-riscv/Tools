name: static-analysis

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The tools that need no project environment come pinned in the image (ruff, pylint, pyright,
    # deptry and uv audit still run with `uv run` in the environment `uv sync` builds from uv.lock).
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ruff lint
            run: uv run ruff check . --output-format=github
          - name: ruff format
            run: uv run ruff format . --check
          - name: pycodestyle
            run: pycodestyle --max-line-length=79 --max-doc-length=72 --ignore=E203,W503 src tests
          - name: pydocstyle
            run: pydocstyle --convention=pep257 src tests
          - name: pylint
            run: uv run pylint .
          - name: pyright
            run: uv run pyright
          - name: pyrefly
            run: pyrefly check
          - name: deptry
            run: uv run deptry .
          - name: complexipy
            run: complexipy .
          - name: codeclone
            run: codeclone . --fail-on-new
          - name: semgrep
            run: semgrep scan --config p/python --error .
          - name: uv audit
            run: uv audit

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the project
        run: uv sync --locked

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
