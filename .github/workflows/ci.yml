name: ci

on:
  # Push só na main: em outra branch o pull_request já roda o mesmo workflow.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reuses the pull request result: a push to main whose merge commit joins a head that this same
  # workflow already passed in a run that started after the first parent (the base) existed, holds
  # the tree that was tested, because main did not move in between; the jobs below are skipped.
  # Any doubt (no match, API error) runs everything.
  reuse:
    name: reuse
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
      images: ${{ steps.plan.outputs.images }}
      gates: ${{ steps.plan.outputs.gates }}

    steps:
      - uses: actions/checkout@v7

      # The digests of the CI images (ci-images.lock) and, for each gate, the key of its inputs: a gate whose
      # key already has a pass (artifact ci-pass-<gate>-<key>) is skipped, whatever the commit, branch or event.
      - name: Read the image digests and look for a pass of the same inputs
        id: plan
        uses: insper-riscv/Infra/.github/actions/ci-plan@main
        with:
          gates: |
            unit-tests|ci-elf|!docs/** !**/*.md !LICENSE !AUTHORS* !CITATION.cff !codeclone.baseline.json !ci-images.lock !.github/workflows/version-bump.yml !.github/workflows/tree.yml

      - name: Look for a passed pull request run of the same tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          skip=false
          if [ "$EVENT" = push ]; then
            parents=$(gh api "repos/$REPO/commits/$SHA" --jq '[.parents[].sha] | join(" ")' || true)
            read -r base head extra <<< "$parents"
            if [ -n "${head:-}" ] && [ -z "${extra:-}" ]; then
              basedate=$(gh api "repos/$REPO/commits/$base" --jq '.commit.committer.date' || true)
              export BASEDATE="${basedate:-9999}"
              found=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success&per_page=100" \
                --jq '[.workflow_runs[] | select(.name == $ENV.WORKFLOW and .created_at >= $ENV.BASEDATE)] | length' || echo 0)
              if [ "${found:-0}" -gt 0 ]; then
                skip=true
                echo "::notice::Reusing the passed pull request run of $head over base $base."
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # The job id and name are the status check the default-branch ruleset requires, so they must not change.
  unit-tests:
    name: unit-tests
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' && fromJSON(needs.reuse.outputs.gates)['unit-tests'].skip != 'true' }}
    # The image carries GHDL, the RISC-V GCC and a patched Spike, so the whole
    # suite (simulation and Spike tests included) runs on a hosted runner.
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build the test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: riscv-tools-tests:ci
          build-args: TOOLCHAIN_IMAGE=${{ fromJSON(needs.reuse.outputs.images)['ci-elf'] }}

      - name: Run the test suite
        run: docker run --rm -v "$PWD:/workspace" riscv-tools-tests:ci -v

      - name: Record the pass of these inputs
        # Only reached when every step above passed: a later run with the same key skips this gate.
        env:
          KEY: ${{ fromJSON(needs.reuse.outputs.gates)['unit-tests'].key }}
        run: echo "$KEY" > ci-pass.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ fromJSON(needs.reuse.outputs.gates)['unit-tests'].artifact }}
          path: ci-pass.txt
          overwrite: true

  # The job id and name are the status check the default-branch ruleset requires, so they must not change.
  python-static-analysis:
    name: python-static-analysis
    needs: reuse
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The tools that need no project environment come pinned in the image (ruff, pylint, pyright,
    # deptry and uv audit still run with `uv run` in the environment `uv sync` builds from uv.lock).
    container:
      image: ${{ fromJSON(needs.reuse.outputs.images)['ci-vhdl'] }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the project
        run: uv sync --locked

      - name: ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check . --output-format=github

      - name: ruff format
        if: ${{ !cancelled() }}
        run: uv run ruff format . --check

      - name: pycodestyle
        if: ${{ !cancelled() }}
        run: pycodestyle --max-line-length=79 --max-doc-length=72 --ignore=E203,W503 src tests

      - name: pydocstyle
        if: ${{ !cancelled() }}
        run: pydocstyle --convention=pep257 src tests

      - name: pylint
        if: ${{ !cancelled() }}
        run: uv run pylint .

      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run pyright

      - name: pyrefly
        if: ${{ !cancelled() }}
        run: pyrefly check

      - name: deptry
        if: ${{ !cancelled() }}
        run: uv run deptry .

      - name: complexipy
        if: ${{ !cancelled() }}
        run: complexipy .

      - name: codeclone
        if: ${{ !cancelled() }}
        run: codeclone . --fail-on-new

      - name: semgrep
        if: ${{ !cancelled() }}
        run: semgrep scan --config p/python --error .

      - name: uv audit
        if: ${{ !cancelled() }}
        run: uv audit
